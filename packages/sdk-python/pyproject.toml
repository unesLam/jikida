[project]
name = "jikida"
version = "0.1.0"
description = "Jikida Python SDK — fail-open security middleware for FastAPI, Django, Flask."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jikida", email = "info@jikida.io" }]
keywords = ["security", "waf", "middleware", "fastapi", "django", "flask", "jikida"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://jikida.io"
Docs = "https://jikida.io/install"
Source = "https://github.com/unesLam/jikida"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
