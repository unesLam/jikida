<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="sidebar.css">
  <title>Jikida.io Security</title>
</head>
<body>
  <header class="sb-hd">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/></svg></span>
      <span class="brand-name">Jikida.io</span>
    </div>
    <span class="host-chip" id="hostChip"></span>
  </header>

  <div class="score" id="scoreCard">
    <div class="score-grade" id="scoreGrade">—</div>
    <div class="score-meta">
      <p class="score-line" id="scoreLine">Scan this page to begin</p>
      <p class="score-sub" id="scoreSub"></p>
    </div>
  </div>

  <div class="sb-actions">
    <button id="scanBtn" class="btn btn-primary">Scan current page</button>
    <button id="autoBtn" class="btn">Auto scan · 10 pages</button>
  </div>
  <div class="sb-export" id="exportRow" hidden>
    <button id="exportHtml" class="ghost" type="button">Export report (HTML)</button>
    <button id="exportPrint" class="ghost" type="button">Save as PDF</button>
  </div>
  <div id="progress" class="progress" hidden>
    <div class="progress-bar"><span id="progressFill"></span></div>
    <p id="progressTxt" class="progress-txt"></p>
  </div>

  <nav class="tabs">
    <button class="tab on" data-tab="findings">Findings <span class="tab-count" id="cFindings"></span></button>
    <button class="tab" data-tab="surface">Attack surface</button>
    <button class="tab" data-tab="account">Account</button>
  </nav>

  <!-- Findings -->
  <section class="pane on" data-pane="findings">
    <div class="filters" id="sevFilters"></div>
    <ul id="findings" class="findings"></ul>
  </section>

  <!-- Attack surface -->
  <section class="pane" data-pane="surface">
    <div class="surf-stats" id="surfStats"></div>
    <p class="surf-h">Pages discovered</p>
    <ul id="surfUrls" class="surf-list"></ul>
    <p class="surf-h">API endpoints seen</p>
    <ul id="surfApis" class="surf-list"></ul>
    <p class="surf-note" id="surfNote"></p>
  </section>

  <!-- Account -->
  <section class="pane" data-pane="account">
    <div id="accountBox"></div>
  </section>

  <footer class="sb-foot">
    <a href="https://jikida.io" target="_blank" rel="noopener" class="foot-link">Browse your app. Jikida.io checks its attack surface.</a>
  </footer>

  <!-- Finding detail drawer -->
  <div id="drawer" class="drawer" hidden>
    <div class="drawer-hd">
      <button id="drawerBack" class="ghost">← Back</button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </div>

  <script type="module" src="sidebar.js"></script>
</body>
</html>
